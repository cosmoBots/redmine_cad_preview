name: release
on:
  push:
    tags:
      - 'v*' # Trigger bei Tags wie v1.0.0

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version
        id: version
        run: |
          REPOSITORY=${GITHUB_REPOSITORY#*/}
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "filename=$REPOSITORY-$VERSION" >> $GITHUB_ENV
          echo "plugin=$REPOSITORY" >> $GITHUB_ENV

      # The release text is the section of the version in CHANGELOG.md, from
      # "## v1.2.1 (date)" to the next "## ". The release fails without it.
      - name: Generate release notes
        run: |
          awk -v heading="## ${{ env.version }} " '
            index($0, heading) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release_notes.md

          if [ "$(grep -c '^\* ' release_notes.md)" -eq 0 ]; then
            echo "::error file=CHANGELOG.md::No entries for ${{ env.version }} in CHANGELOG.md"
            exit 1
          fi
          cat release_notes.md

      # Only the files needed to run the plugin. The sources of the JavaScript
      # (frontend/), the tests, the documentation images and the Gemfile (only
      # used by the tests) are not included.
      - name: Archive
        run: |
          cd ..
          zip -r ${{ env.filename }}.zip \
            ${{ env.plugin }}/app ${{ env.plugin }}/assets ${{ env.plugin }}/config \
            ${{ env.plugin }}/lib ${{ env.plugin }}/licenses ${{ env.plugin }}/init.rb \
            ${{ env.plugin }}/LICENSE ${{ env.plugin }}/THIRD_PARTY_NOTICES.md \
            ${{ env.plugin }}/README.md ${{ env.plugin }}/CHANGELOG.md
          mv ${{ env.filename }}.zip ${{ env.plugin }}/

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          draft: true
          files: ${{ env.filename }}.zip
